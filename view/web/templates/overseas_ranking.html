{% extends "base.html" %}

{% block content %}
    <div id="section-overseas-ranking" class="section">
        <div class="card">
            <h2>미국 상위 종목 랭킹</h2>
            <p class="small">
                S&amp;P 500 구성종목 기준입니다. 외국인·기관·개인 수급 랭킹은 KRX 전용 데이터라 미국장에서는 제공되지 않습니다.
            </p>
            <div class="form-row">
                <button class="btn ranking-tab active" data-category="rise" onclick="loadOverseasRanking('rise')">상승률</button>
                <button class="btn ranking-tab" data-category="fall" onclick="loadOverseasRanking('fall')">하락률</button>
                <button class="btn ranking-tab" data-category="volume" onclick="loadOverseasRanking('volume')">거래량</button>
                <button class="btn ranking-tab" data-category="trading_value" onclick="loadOverseasRanking('trading_value')">거래대금</button>
            </div>
            <div class="form-row">
                <button class="btn ranking-limit active" data-limit="30" onclick="setOverseasRankingLimit(30)">상위 30</button>
                <button class="btn ranking-limit" data-limit="50" onclick="setOverseasRankingLimit(50)">상위 50</button>
                <button class="btn ranking-limit" data-limit="100" onclick="setOverseasRankingLimit(100)">상위 100</button>
            </div>
        </div>
        <div id="overseas-ranking-result"></div>
    </div>
{% endblock %}

{% block scripts %}
<script src="/static/js/overseas_ranking.js?v=2"></script>
{% endblock %}
